<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" width="100%" role="img" aria-label="Cache growth per minute against card size">
<style>text{font-family:ui-monospace,Consolas,monospace;color:#0b0b0c}.t{font-size:11px;fill:#3a3a3d}.s{font-size:9.5px}.m{fill:#75736d}.h{font-size:12px}</style>
<text class="h" x="20" y="18">WHAT ONE MINUTE OF ROLLOUT WRITES · GB per minute, log scale</text>
<text class="s" x="20" y="48">compressed video out</text>
