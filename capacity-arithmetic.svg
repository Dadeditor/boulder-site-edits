<text class="s m" x="354.76" y="414">22.6 s</text>
<text class="s m" x="616.00" y="424">57.6 s</text>
<text class="t s" x="20" y="442">No card holds a minute. At the reference geometry the cache grows 510 GB per minute, so the </text>
<text class="t s" x="20" y="456">biggest card here buys 23 s of rollout at that rate, 58 at the WorldKV figure.</text>
<text class="s m" x="20" y="470">Source: docs/main.pdf Appendix A (1280x720, 24 fps, 24 layers x 1024 wide, bf16 latents); </text>
<text class="s m" x="20" y="483">tier ladder from the Investor Summary. H100, H200 and B200 capacities are published vendor </text>
<text class="s m" x="20" y="496">figures, not measurements in this repository.</text>
</svg>
