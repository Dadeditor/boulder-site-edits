<text class="s m" x="208.37" y="284" text-anchor="middle">30,192</text>
<line x1="271.16" y1="222" x2="271.16" y2="272" stroke="#ff3d2e" stroke-width="1.2"/>
<text class="s m" x="271.16" y="284" text-anchor="middle">40,256</text>
<text class="t s" x="20" y="302">Four lane boundaries in a flat buffer: the offsets a reader has to trust.</text>
<text class="h" x="20" y="332">THE EDGES MOVE WITH THE CONTRACT</text>
<text class="t s" x="20" y="350">stride 10,064 B → 10,064 · 20,128 · 30,192 · 40,256</text>
<text class="t s" x="20" y="366">plus an 8-byte per-lane transport header → 10,072 · 20,144 · 30,216 · 40,288</text>
<text class="s m" x="20" y="382">The report names the per-lane header (§6) but never publishes its size, so 10,072 is worked </text>
<text class="s m" x="20" y="395">arithmetic: it shows how the boundaries move when the stride changes, not a number taken </text>
<text class="s m" x="20" y="408">from the layout.</text>
<text class="h" x="20" y="428">AT 4,096 LANES</text>
<text class="t s" x="20" y="444">4,096 × 10,064 = 41,222,144 B (about 41.2 MB), plus 68,736 B shared once = 41,290,880 B</text>
<text class="s m" x="20" y="466">Table 1 names 11 of the 13 blocks and 65 of the 77 fields; the strip draws those 11 blocks </text>
<text class="s m" x="20" y="479">and the shared tier as one block. Source: warp-godot-report.pdf §2.3, Table 1, Appendix A.1. </text>
<text class="s m" x="20" y="492">Widths other than the contact block are drawn in proportion to field count, because the </text>
<text class="s m" x="20" y="505">report publishes field counts per block, not bytes.</text>
</svg>
